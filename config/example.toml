# StarVektor configuration: commented example.
#
# The active values are the defaults (a test enforces this), so copying this
# file as is is equivalent to having no configuration.
#
# Usual path: ~/.config/starvektor/config.toml (`starvektor config path`).
# Edit it by hand or with `starvektor tui`. Saving from the TUI rewrites the
# file and comments are not preserved.
#
# Environment variables that override the file (for example in Steam's launch
# option: `STARVEKTOR_MAX_LEVEL=1 %command%`):
#   STARVEKTOR_ENABLED         1/0, true/false, on/off
#   STARVEKTOR_MAX_LEVEL       0 to 3
#   STARVEKTOR_HOOK            auto, vulkan, gamescope
#   STARVEKTOR_BUDGET_FRACTION number in (0, 0.5]
#   STARVEKTOR_CONFIG          alternative file path

config_version = 1

[general]
# Master switch. When off, StarVektor lets everything through.
enabled = true

[regulator]
# Regulator cap: 0 off, 1 classic, 2 minimal network, 3 full network.
max_level = 3
# Fraction of the game's base frame time that StarVektor may spend per frame.
budget_fraction = 0.12
# If free VRAM drops below this value (MB), the regulator drops a level.
vram_floor_mb = 400
# Extra free VRAM (MB) above the minimum needed to go up a level.
vram_margin_mb = 200
# To go up, the cost must be at most this fraction of the budget.
up_margin = 0.6
# Consecutive bad frames before dropping a level.
panic_frames = 3
# Consecutive good frames before going up a level.
settle_frames = 120
# Maximum wait multiplier after forced drops.
max_backoff = 8

[hook]
# auto, vulkan or gamescope. "auto" will choose based on the Phase 1 measurement.
mode = "auto"

[telemetry]
# Writes one JSONL log per run (no images or game data).
enabled = true
# Log directory. If missing: ~/.local/state/starvektor/logs
# dir = "/path/to/logs"
# Shows frame time, active level and the mark key.
overlay = false
# Key that records a user_mark ("I saw an artifact here").
mark_key = "F9"

# Per-game profiles: the name must match exactly. Anything not set inherits the
# global value. Examples:
#
# [profiles.Valorant]
# enabled = false
#
# [profiles.Control]
# max_level = 2
# budget_fraction = 0.10
# hook = "gamescope"
[profiles]

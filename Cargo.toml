[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
publish = false
authors = ["DinoPathTeam"]
repository = "https://github.com/DinoPathTeam/StarVektor"

# Versions live here; each crate declares only what it uses (`workspace = true`).
# Which crate may depend on which is set by `architecture/layers.toml` and checked
# by `scripts/check_layers.py` (also in CI).
[workspace.dependencies]
sv-types = { path = "crates/sv-types" }
sv-core = { path = "crates/sv-core" }
sv-telemetry = { path = "crates/sv-telemetry" }
sv-config = { path = "crates/sv-config" }
sv-gfx = { path = "crates/sv-gfx" }
sv-platform = { path = "crates/sv-platform" }
sv-platform-linux = { path = "crates/sv-platform-linux" }
sv-inference = { path = "crates/sv-inference" }
sv-tui = { path = "crates/sv-tui" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
ratatui = "0.30"

[workspace.lints.rust]
# Nothing is `unsafe` by default. FFI crates (C++ shim, Vulkan layer) that need it
# will declare it in their own Cargo.toml, and that will be visible in review.
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1

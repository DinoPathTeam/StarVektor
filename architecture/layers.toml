# Dependency rules between crates. Checked by `scripts/check_layers.py`.
#
# `allow`: workspace crates this crate may use (in dependencies,
#          dev-dependencies or build-dependencies). Everything else is forbidden.
# `external`: allowed third-party crates. If a crate does not appear in
#          [external], its external dependencies are not restricted.
#
# To add a new dependency, edit this file in the same change, so the decision
# is visible in review.

[crates.sv-types]
layer = "contracts"
allow = []

[crates.sv-core]
layer = "core"
allow = ["sv-types"]

[crates.sv-telemetry]
layer = "core"
allow = ["sv-types"]

[crates.sv-config]
layer = "core"
allow = ["sv-types"]

[crates.sv-inference]
layer = "backend"
allow = ["sv-types"]

[crates.sv-gfx]
layer = "backend"
allow = ["sv-types"]

[crates.sv-platform]
layer = "platform"
allow = ["sv-types"]

[crates.sv-platform-linux]
layer = "platform"
allow = ["sv-types"]

[crates.sv-tui]
layer = "interface"
allow = ["sv-config", "sv-types"]

# Composition root: the only place where all layers are connected.
[crates.starvektor-cli]
layer = "composition"
allow = ["*"]

[external]
# The core depends on nothing external: no operating system, no graphics.
sv-types = ["serde"]
sv-core = []
sv-gfx = []
sv-platform = []
sv-platform-linux = []
sv-inference = []
sv-telemetry = ["serde", "serde_json"]
sv-config = ["serde", "toml", "thiserror"]
sv-tui = ["ratatui"]

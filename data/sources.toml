# Permitted data sources for StarVektor (milestone H0.3).
#
# Rule: a sequence with no entry here does not enter any dataset.
# The full policy is in docs/data-policy.md and is checked by
# scripts/check_sources.py (also in CI).
#
# Each [[source]] entry declares:
#   id          unique, stable identifier
#   kind        own_scene | open_dataset | permitted_game
#   use         list with "train" and/or "eval"
#   license     license (SPDX if one exists) or "own"
#   origin      where it comes from (repository, URL, engine and version)
#   added       date added, YYYY-MM-DD
#   frame_generation  must be "off": the entry is captured without frame generation
#   permission  permitted_game only: link or reference to the explicit permission
#   game        permitted_game only: name of the game
#
# Example (uncomment and fill in when adding the first own scene):
#
# [[source]]
# id = "godot-exploration-scene-01"
# kind = "own_scene"
# use = ["train", "eval"]
# license = "own"
# origin = "own scene in Godot 4.x, generated for StarVektor"
# added = "2026-10-26"
# frame_generation = "off"

schema = 1

# Commercial games: used to measure quality and cost, never to train.
# Pending: review each one's EULA before capturing anything.
[evaluation_only]
games = [
  "Control",
  "Cyberpunk 2077",
  "The Witcher 3 (2026 version)",
  "Crimson Desert",
  "The Elder Scrolls V: Skyrim Special Edition",
  "The Medium",
  "Hell is Us",
  "Metro: Last Light Redux",
]

# Existing frame generators: comparison reference only, never a training
# target.
[reference_only]
systems = ["FSR 3", "AFMF 2", "DLSS FG", "OptiScaler FG"]
